[project]
name = "shipshape"
version = "0.1.0"
description = "Interactive tools for keeping local development tidy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1",
]

[project.scripts]
ports = "shipshape.ports.cli:main"
prune-local-branches = "shipshape.prune.cli:main"
search-transcripts = "shipshape.transcripts.cli:main"
update-tickets = "shipshape.tickets.cli:main"
wt = "shipshape.worktrees.cli:main"

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
